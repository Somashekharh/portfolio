<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#008080">
    <meta name="author" content="Portfolio 95">
    <meta name="description" content="A personal portfolio inside an interactive Windows 95 desktop.">
    <meta name="keywords" content="Windows 95 portfolio, Oracle DBA, cloud infrastructure, cybersecurity">
    <meta property="og:title" content="Portfolio 95">
    <meta property="og:description" content="A professional portfolio explored through a Windows 95 desktop.">
    <meta property="og:type" content="website">
    <title>Portfolio 95</title>
    <link rel="icon" href="assets/icons/computer.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/data.js" defer></script>
    <script src="js/apps.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/window-manager.js" defer></script>
    <script src="js/terminal.js" defer></script>
  </head>
  <body>
    <main class="desktop" id="desktop" aria-label="Interactive Windows 95 portfolio desktop">
      <div class="boot-screen" data-boot-screen role="status" aria-live="polite">
        <div class="boot-box">
          <div class="boot-brand"><span class="boot-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><strong>Portfolio 95</strong><small>Microsoft Windows 95 inspired</small></div></div>
          <div class="boot-rule"></div>
          <p class="boot-heading">Starting Portfolio 95...</p>
          <div class="boot-lines" data-boot-lines></div>
          <div class="boot-bottom"><span data-boot-credit>Portfolio 95</span><button class="classic-button" type="button" data-skip-boot>Skip</button></div>
        </div>
      </div>

      <section class="desktop-icons" data-desktop-icons aria-label="Desktop shortcuts"></section>
      <div class="window-layer" data-window-layer aria-label="Open applications"></div>
      <div class="crt-overlay" aria-hidden="true"></div>

      <section class="safe-screen" data-safe-screen hidden aria-live="polite">
        <div><span class="safe-logo">Portfolio 95</span><p>It is now safe to close this portfolio.</p><button class="classic-button" type="button" data-restart>Restart Portfolio</button></div>
      </section>

      <div class="context-menu" data-context-menu role="menu" hidden></div>
      <div class="toast" data-toast role="status" aria-live="polite"></div>

      <footer class="taskbar" aria-label="Windows taskbar">
        <button class="start-button" type="button" data-start aria-expanded="false" aria-controls="start-menu"><span class="start-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>Start</strong></button>
        <span class="taskbar-divider" aria-hidden="true"></span>
        <div class="taskbar-apps" data-taskbar-apps aria-label="Open applications"></div>
        <div class="system-tray" aria-label="System tray"><span class="tray-divider" aria-hidden="true"></span><span class="tray-icon tray-volume" role="img" aria-label="Sound off">◖</span><span class="tray-icon tray-network" role="img" aria-label="Network connected">◉</span><time data-clock datetime=""></time></div>
      </footer>

      <nav class="start-menu" id="start-menu" data-start-menu aria-label="Start menu" hidden>
        <div class="start-menu-rail"><span class="rail-portfolio">PORTFOLIO</span><b>95</b></div>
        <div class="start-menu-items" data-start-items></div>
      </nav>
    </main>
  </body>
</html>
